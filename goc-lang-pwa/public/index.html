const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function hashStr(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(36)+(h1>>>0).toString(36)}
const ehash=e=>{const{id,...r}=e;return hashStr(JSON.stringify(sortDeep(r)))};
function sortDeep(v){if(Array.isArray(v))return v.map(sortDeep);if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{if(v[k]!==undefined)o[k]=sortDeep(v[k])});return o}return v}
const SYNCKEY=()=>'goclang.sync.'+(CLOUD.user?CLOUD.user.uid:'');
function loadSynced(){try{CLOUD.synced=JSON.parse(localStorage.getItem(SYNCKEY()))||{}}catch(e){CLOUD.synced={}}}
function saveSynced(){try{localStorage.setItem(SYNCKEY(),JSON.stringify(CLOUD.synced))}catch(e){}}
function setUserKeys(uid){KEY=uid?'goclang.v1.u.'+uid:'goclang.v1';DRAFT=uid?'goclang.draft.u.'+uid:'goclang.draft';db=load()}

async function cloudInit(){
  const V=CFG.firebaseVersion||'12.6.0',B=`https://www.gstatic.com/firebasejs/${V}`;
  const [app,auth,fs]=await Promise.all([import(`${B}/firebase-app.js`),import(`${B}/firebase-auth.js`),import(`${B}/firebase-firestore.js`)]);
  const a=app.initializeApp(CFG.firebase);
  CLOUD.api={...auth,...fs};
  CLOUD.auth=auth.getAuth(a);
  try{CLOUD.auth.languageCode='vi'}catch(e){}
  CLOUD.fs=fs.initializeFirestore(a,{ignoreUndefinedProperties:true,localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
  CLOUD.ready=true;
  try{await auth.getRedirectResult(CLOUD.auth)}catch(e){CLOUD.loginErr=friendlyAuthErr(e)}
}
function friendlyAuthErr(e){const c=(e&&e.code)||'';
  if(c.includes('popup-closed')||c.includes('cancelled'))return'';
  if(c.includes('unauthorized-domain'))return'Tên miền này chưa được cho phép đăng nhập (xem hướng dẫn, mục 3).';
  if(c.includes('network'))return'Không có kết nối mạng. Thử lại khi có mạng nhé.';
  return'Đăng nhập chưa thành công ('+(c||'lỗi không rõ')+').'}
async function cloudSignIn(){
  const{GoogleAuthProvider,signInWithPopup,signInWithRedirect}=CLOUD.api;const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  if(isIOS()&&isStandalone())return signInWithRedirect(CLOUD.auth,p);
  try{await signInWithPopup(CLOUD.auth,p)}
  catch(e){if((e.code||'').includes('popup-blocked'))return signInWithRedirect(CLOUD.auth,p);throw e}
}
const emailAllowed=u=>!(CFG.allowedEmails&&CFG.allowedEmails.length)||CFG.allowedEmails.map(x=>x.toLowerCase()).includes((u.email||'').toLowerCase());

/* ----- đồng bộ: mỗi bài là một tài liệu users/{uid}/entries/{id} ----- */
function cloudStatus(s){CLOUD.status=s;const d=$('#acctDot');if(d)d.className='acct-dot '+s;const t=$('#syncText');if(t)t.textContent=SYNC_TEXT[s]||''}
const SYNC_TEXT={ok:'Đã đồng bộ',pending:'Đang đồng bộ…',offline:'Ngoại tuyến — sẽ đồng bộ khi có mạng',error:'Lỗi đồng bộ',off:''};
function cloudListen(){
  const{collection,onSnapshot}=CLOUD.api;let first=true;
  CLOUD.unsub=onSnapshot(collection(CLOUD.fs,'users',CLOUD.user.uid,'entries'),{includeMetadataChanges:true},snap=>{
    const md=snap.metadata;cloudStatus(md.hasPendingWrites?'pending':md.fromCache?(navigator.onLine?'pending':'offline'):'ok');
    const cloud=new Map();snap.docs.forEach(d=>cloud.set(d.id,d.data()));
    const local=new Map(db.entries.map(e=>[e.id,e]));let changed=false,needPush=false;
    const now=Date.now();
    Object.keys(CLOUD.pend).forEach(id=>{const pd=CLOUD.pend[id];const ce=cloud.get(id);
      if(now-pd.t>30000||(pd.h==='del'?!ce:ce&&ehash(ce)===pd.h))delete CLOUD.pend[id]});
    cloud.forEach((ce,id)=>{const h=ehash(ce),le=local.get(id);if(CLOUD.pend[id])return;
      if(!le){if(CLOUD.synced[id]){needPush=true;return}db.entries.push({...ce,id});CLOUD.synced[id]=h;changed=true;return}
      const lh=ehash(le);if(lh===h){CLOUD.synced[id]=h;return}
      if(CLOUD.synced[id]===lh||(ce.updatedAt||0)>=(le.updatedAt||0)){Object.keys(le).forEach(k=>delete le[k]);Object.assign(le,ce,{id});CLOUD.synced[id]=h;changed=true}
      else needPush=true});
    const trustDeletes=!(md.fromCache&&first&&cloud.size===0);
    db.entries=db.entries.filter(e=>{if(cloud.has(e.id))return true;
      if(CLOUD.pend[e.id])return true;
      if(CLOUD.synced[e.id]&&trustDeletes){if(CLOUD.synced[e.id]===ehash(e)){delete CLOUD.synced[e.id];changed=true;return false}}
      needPush=true;return true});
    first=false;saveSynced();
    if(changed){persist();if(view!=='write')render()}
    if(needPush)cloudQueue();
  },err=>{console.warn(err);cloudStatus('error');if((err.code||'').includes('permission'))toast('Tài khoản này chưa được cấp quyền dùng app')});
}
function cloudQueue(){if(!CLOUD.user)return;clearTimeout(CLOUD.pushT);CLOUD.pushT=setTimeout(cloudPush,350)}
function cloudPush(){
  if(!CLOUD.user||!CLOUD.fs)return;const{doc,setDoc,deleteDoc}=CLOUD.api,uid=CLOUD.user.uid;let touched=false;
  const ids=new Set();
  db.entries.forEach(e=>{ids.add(e.id);let h=ehash(e);if(CLOUD.synced[e.id]===h)return;
    if(CLOUD.synced[e.id]){e.updatedAt=Date.now();h=ehash(e);touched=true}
    const{id,...data}=e;CLOUD.synced[e.id]=h;CLOUD.pend[id]={h,t:Date.now()};
    setDoc(doc(CLOUD.fs,'users',uid,'entries',id),sortDeep(data)).catch(err=>{console.warn(err);cloudStatus('error')})});
  Object.keys(CLOUD.synced).forEach(id=>{if(!ids.has(id)){delete CLOUD.synced[id];CLOUD.pend[id]={h:'del',t:Date.now()};
    deleteDoc(doc(CLOUD.fs,'users',uid,'entries',id)).catch(err=>console.warn(err))}});
  saveSynced();if(touched)persist();
}
async function cloudSignOut(clearLocal=true){
  const{signOut,terminate,clearIndexedDbPersistence,waitForPendingWrites}=CLOUD.api;
  if(!navigator.onLine&&!confirm('Bạn đang ngoại tuyến — những bài chưa kịp đồng bộ sẽ mất khi đăng xuất. Vẫn đăng xuất?'))return;
  try{await Promise.race([waitForPendingWrites(CLOUD.fs),new Promise(r=>setTimeout(r,4000))])}catch(e){}
  const uid=CLOUD.user&&CLOUD.user.uid;
  if(CLOUD.unsub)CLOUD.unsub();
  await signOut(CLOUD.auth);
  if(clearLocal&&uid){['goclang.v1.u.','goclang.draft.u.','goclang.sync.','goclang.drive.'].forEach(p=>{try{localStorage.removeItem(p+uid)}catch(e){}});
    try{await terminate(CLOUD.fs);await clearIndexedDbPersistence(CLOUD.fs)}catch(e){}}
  location.reload();
}
function legacyMigrate(){
  let old;try{old=JSON.parse(localStorage.getItem('goclang.v1'))}catch(e){}
  if(!old||!old.entries||!old.entries.length||old.migratedTo)return;
  const ids=new Set(db.entries.map(e=>e.id)),n=old.entries.filter(e=>!ids.has(e.id)).length;if(!n)return;
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="card" style="width:min(440px,100%);text-align:center"><div class="pin-ic" style="font-size:24px">📥</div><h2>Có ${n} bài viết cũ trên máy này</h2>
    <p class="muted" style="margin-top:0">Những bài này được viết trước khi đăng nhập. Đưa chúng vào tài khoản <b>${esc(CLOUD.user.email)}</b> nhé?</p>
    <p class="muted" style="font-size:13px">Nếu đây là bài của người khác dùng chung máy, hãy chọn “Không”.</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="mgN">Không</button><button class="btn primary" id="mgY">Đưa vào tài khoản</button></div></div>`;
  document.body.appendChild(o);const close=()=>{o.classList.add('closing');setTimeout(()=>o.remove(),400)};
  o.querySelector('#mgN').onclick=()=>{old.migratedTo='declined:'+CLOUD.user.uid;try{localStorage.setItem('goclang.v1',JSON.stringify(old))}catch(e){}close()};
  o.querySelector('#mgY').onclick=()=>{const k=mergeData(old);old.migratedTo=CLOUD.user.uid;try{localStorage.setItem('goclang.v1',JSON.stringify(old))}catch(e){}close();toast(`Đã đưa ${k} bài vào tài khoản`);render()};
}

/* ================= Sao lưu Google Drive (mỗi tài khoản một thư mục riêng) ================= */
const DRIVE={token:null,exp:0,folder:null,gis:null,list:null};
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file',DRIVE_FOLDER='Góc Lặng - Sao lưu',DRIVE_KEEP=30;
const driveOn=()=>!!(CFG.googleClientId&&CLOUD.user);
const DKEY=()=>'goclang.drive.'+(CLOUD.user?CLOUD.user.uid:'');
const driveLast=()=>{try{return +localStorage.getItem(DKEY())||0}catch(e){return 0}};
function loadGIS(){if(DRIVE.gis)return DRIVE.gis;DRIVE.gis=new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{DRIVE.gis=null;rej(new Error('gis'))};document.head.appendChild(s)});return DRIVE.gis}
function driveAuth(){
  if(DRIVE.token&&Date.now()<DRIVE.exp)return Promise.resolve();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.googleClientId,scope:DRIVE_SCOPE,login_hint:CLOUD.user.email,
      callback:r=>{if(r.error)return rej(r);DRIVE.token=r.access_token;DRIVE.exp=Date.now()+((+r.expires_in||3600)-120)*1000;res()},
      error_callback:e=>rej(e)});
    tc.requestAccessToken({prompt:''});
  });
}
async function gapi(url,opt={}){
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+DRIVE.token,...(opt.headers||{})}});
  if(r.status===401){DRIVE.token=null;throw new Error('auth')}
  if(!r.ok)throw new Error('drive '+r.status);
  return opt.raw?r:r.json();
}
const DAPI='https://www.googleapis.com/drive/v3/files',UAPI='https://www.googleapis.com/upload/drive/v3/files';
async function driveFolder(){
  if(DRIVE.folder)return DRIVE.folder;
  const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r=await gapi(`${DAPI}?q=${q}&fields=files(id)&spaces=drive`);
  if(r.files&&r.files.length)return DRIVE.folder=r.files[0].id;
  const c=await gapi(DAPI+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})});
  return DRIVE.folder=c.id;
}
async function driveList(){
  const f=await driveFolder();const q=encodeURIComponent(`'${f}' in parents and trashed=false`);
  const r=await gapi(`${DAPI}?q=${q}&orderBy=name desc&pageSize=100&fields=files(id,name,modifiedTime,size)`);
  return DRIVE.list=r.files||[];
}
async function driveBackup(){
  await driveAuth();const f=await driveFolder();const files=await driveList();
  const name=`goc-lang-${dayKey(Date.now())}.json`,body=JSON.stringify({app:'goc-lang',v:1,account:CLOUD.user.email,at:Date.now(),entries:db.entries},null,1);
  const same=files.find(x=>x.name===name);
  if(same)await gapi(`${UAPI}/${same.id}?uploadType=media&fields=id`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  else{const bd='goclang'+Date.now(),meta={name,parents:[f],mimeType:'application/json'};
    const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
    await gapi(`${UAPI}?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp})}
  const all=await driveList();
  for(const old of all.slice(DRIVE_KEEP))try{await gapi(`${DAPI}/${old.id}`,{method:'DELETE',raw:true})}catch(e){}
  try{localStorage.setItem(DKEY(),String(Date.now()))}catch(e){}
  db.lastBackup=Date.now();persist();
}
async function driveRestore(id){
  await driveAuth();const r=await gapi(`${DAPI}/${id}?alt=media`,{raw:true});const d=await r.json();
  return mergeData(d);
}
function driveHTML(){
  if(!CLOUD.user)return'<p class="muted" style="margin:0">Đăng nhập Google để dùng sao lưu Drive.</p>';
  if(!CFG.googleClientId)return'<p class="muted" style="margin:0">Chưa bật — cần điền <b>googleClientId</b> trong firebase-config.js (xem hướng dẫn, mục 5).</p>';
  const last=driveLast();
  return`<p style="margin-top:0">Lưu một bản sao nhật ký vào thư mục <b>“${DRIVE_FOLDER}”</b> trong Google Drive của <b>${esc(CLOUD.user.email)}</b>. Mỗi ngày một file, giữ ${DRIVE_KEEP} bản gần nhất.</p>
    <p class="muted" style="font-size:14px">Lần gần nhất: ${last?fmtDay(last)+' '+fmtTime(last):'chưa có'}</p>
    <div class="row"><button class="btn primary" id="drvUp">Sao lưu lên Drive</button><button class="btn" id="drvList">Khôi phục từ Drive…</button></div>
    <div id="drvFiles" style="margin-top:10px"></div>
    <p class="muted" style="font-size:12px;margin-bottom:0">App chỉ được quyền truy cập những file do chính nó tạo — không đọc được các file khác trong Drive của bạn.</p>`;
}
function bindDrive(box,rerender){
  const err=e=>{console.warn(e);const t=(e&&(e.type||e.error||e.message))||'';
    toast(t==='popup_closed'||t==='access_denied'?'Bạn chưa cấp quyền Google Drive':t==='popup_failed_to_open'?'Trình duyệt chặn cửa sổ đăng nhập Google':'Chưa sao lưu được — kiểm tra kết nối mạng')};
  const up=box.querySelector('#drvUp');if(up)up.onclick=async()=>{up.disabled=true;up.textContent='Đang sao lưu…';
    try{await driveBackup();FX.burst(up);toast('Đã sao lưu lên Google Drive');rerender()}catch(e){err(e);up.disabled=false;up.textContent='Sao lưu lên Drive'}};
  const ls=box.querySelector('#drvList');if(ls)ls.onclick=async()=>{const out=box.querySelector('#drvFiles');out.innerHTML='<span class="muted">Đang tải danh sách…</span>';
    try{await driveAuth();const fs=await driveList();
      out.innerHTML=fs.length?fs.slice(0,10).map(f=>`<button class="memory" data-fid="${f.id}"><small>${new Date(f.modifiedTime).toLocaleString('vi-VN')}${f.size?' · '+Math.ceil(f.size/1024)+' KB':''}</small><span>${esc(f.name)}</span></button>`).join('')
        :'<span class="muted">Chưa có bản sao lưu nào trên Drive.</span>';
      out.querySelectorAll('[data-fid]').forEach(b=>b.onclick=async()=>{if(!confirm('Thêm các bài trong bản sao lưu này vào nhật ký? Bài đã có sẵn sẽ được giữ nguyên.'))return;
        try{const n=await driveRestore(b.dataset.fid);FX.petals(20);toast(n?`Đã khôi phục ${n} bài`:'Các bài trong bản này đều đã có sẵn');rerender()}catch(e){err(e)}})}
    catch(e){out.innerHTML='';err(e)}};
  if(CFG.googleClientId&&CLOUD.user)loadGIS().catch(()=>{});
}

/* ================= Logo & màn hình mở app ================= */
const LOGO_SVG=`<svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs>
  <linearGradient id="lgBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86a892"/><stop offset="1" stop-color="#4c6b59"/></linearGradient>
  <radialGradient id="lgGlow" cx="256" cy="300" r="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff3d6" stop-opacity=".6"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></radialGradient>
  <clipPath id="lgSky"><rect width="512" height="300"/></clipPath></defs>
  <rect class="lg-bg" width="512" height="512" rx="112" fill="url(#lgBg)"/>
  <g clip-path="url(#lgSky)"><g class="lg-sun"><circle class="lg-glow" cx="256" cy="300" r="150" fill="url(#lgGlow)"/><circle cx="256" cy="300" r="92" fill="#f7efdc"/></g></g>
  <path class="lg-line lg-h" pathLength="1" d="M100 300H412" stroke="#f7efdc" stroke-width="14" stroke-linecap="round"/>
  <path class="lg-line lg-r1" pathLength="1" d="M170 346H342" stroke="#f7efdc" stroke-opacity=".7" stroke-width="12" stroke-linecap="round"/>
  <path class="lg-line lg-r2" pathLength="1" d="M214 388H298" stroke="#f7efdc" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/></svg>`;
let splashT0=0;
function splashStart(){const s=$('#splash');if(!s)return;s.querySelector('.splash-logo').innerHTML=LOGO_SVG;
  s.querySelector('.splash-title').innerHTML=[...'Góc Lặng'].map((c,i)=>`<span style="animation-delay:${1.05+i*.06}s">${c===' '?'&nbsp;':c}</span>`).join('');splashT0=performance.now()}
function splashEnd(){const s=$('#splash');if(!s||s.classList.contains('out'))return Promise.resolve();
  const wait=Math.max(0,(RM?300:2700)-(performance.now()-splashT0));
  return new Promise(r=>setTimeout(()=>{s.classList.add('out');document.body.classList.remove('booting');setTimeout(()=>{s.remove();r()},650)},wait))}

/* ----- cài app (PWA) ----- */
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='settings')render()});
function installHTML(){
  if(isStandalone()||location.protocol==='file:')return'';
  const how=deferredInstall?'<button class="btn primary" id="installBtn">Cài Góc Lặng</button>'
    :isIOS()?'<p class="muted" style="font-size:14px;margin:0">Trên iPhone/iPad: mở bằng <b>Safari</b> → bấm nút <b>Chia sẻ</b> <span style="font-size:16px">⎋</span> → chọn <b>“Thêm vào MH chính”</b>.</p>'
    :'<p class="muted" style="font-size:14px;margin:0">Trên Android: menu ⋮ của Chrome → <b>“Cài đặt ứng dụng”</b>. Trên máy tính: biểu tượng cài đặt ở cuối thanh địa chỉ.</p>';
  return`<div class="card"><h3>Cài app lên điện thoại</h3><p style="margin-top:0">Góc Lặng có thể cài như một app thật: có biểu tượng trên màn hình chính, mở toàn màn hình và dùng được cả khi mất mạng.</p>${how}</div>`;
}

/* ---------- Giao diện sáng/tối ---------- */
function getTheme(){try{return localStorage.getItem(THEME)}catch(e){return null}}
function setTheme(t){try{t==='auto'?localStorage.removeItem(THEME):localStorage.setItem(THEME,t)}catch(e){}applyTheme();if(SC.cfg){scBuild();if(RM)scDraw(0)}}
function applyTheme(){const t=getTheme();t&&t!=='auto'?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme')}
$('#themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#1b1a18';setTheme(dark?'light':'dark')};
/* ---------- Khởi động ---------- */
applyTheme();splashStart();
let appStarted=false;
function startApp(){
  if(appStarted){render();return}appStarted=true;
  updateLockBtn();$('#lockBtn').onclick=lockNow;if(getPin())lockNow();
  render();wxApply();if(wxEnabled())wxRefresh(false);
  if(!locked)setTimeout(checkCarried,700);
  abInit().then(()=>{if(AB.status!=='off'&&(view==='home'||view==='settings'))render()});
  const nq=new URLSearchParams(location.search).get('new');if(nq&&TYPES[nq])go('write',{form:{type:nq}});
}
$('#acctBtn').onclick=()=>go('settings');
(async()=>{
  if(location.protocol==='file:'){await splashEnd();startApp();return}
  if(!cloudConfigured()){await splashEnd();wxApply();showLogin();return}
  try{await cloudInit()}catch(e){console.warn(e);await splashEnd();wxApply();showLogin({err:'Không tải được dịch vụ đăng nhập — kiểm tra kết nối mạng rồi mở lại app.'});return}
  CLOUD.api.onAuthStateChanged(CLOUD.auth,async u=>{
    if(u&&!emailAllowed(u)){const em=u.email;await CLOUD.api.signOut(CLOUD.auth);await splashEnd();wxApply();showLogin({err:`Tài khoản ${em} chưa được cấp quyền dùng Góc Lặng.`});return}
    await splashEnd();
    if(u){if(!CLOUD.user)startSession(u)}
    else if(CLOUD.user)location.reload();
    else{wxApply();showLogin()}
  });
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
