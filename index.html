function wxIcon(code,day,size=40,cls=''){
  const {s}=sceneOf(code,day);
  const rays=`<g class="wi-rays" stroke="#f0b04a" stroke-width="2.2" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="18" y1="4" x2="18" y2="7.5" transform="rotate(${a} 18 18)"/>`).join('')}</g>`;
  const sun=`${rays}<circle cx="18" cy="18" r="7.5" fill="#f2bb5c"/>`;
  const moon=`<path d="M21 5a12 12 0 1 0 10 19A10 10 0 0 1 21 5z" fill="#e6d7a8"/>`;
  const cloud=(f,dx=0,dy=0)=>`<path transform="translate(${dx} ${dy})" d="M14 40h22a8 8 0 0 0 1-16 11 11 0 0 0-21-3 8 8 0 0 0-2 19z" fill="${f}"/>`;
  const drops=n=>[16,24,32].slice(0,n).map((x,i)=>`<line class="wi-drop" style="animation-delay:${i*.33}s" x1="${x}" y1="37" x2="${x-2}" y2="43" stroke="#6b9bd1" stroke-width="2.2" stroke-linecap="round"/>`).join('');
  let b='';
  if(s==='clear-day')b=`<g transform="translate(6 6)">${sun}</g>`;
  else if(s==='clear-night')b=`<g transform="translate(4 4)">${moon}</g>`;
  else if(s==='partly-day')b=sun+cloud('#e3e7ed',4,2);
  else if(s==='partly-night')b=moon+cloud('#b8c0cc',4,2);
  else if(s.startsWith('cloudy'))b=cloud('#cfd5de',-4,-7)+cloud('#aab3c0',4,0);
  else if(s==='rain')b=cloud('#9aa5b4',0,-9)+drops(3);
  else if(s==='storm')b=cloud('#7c8696',0,-9)+`<path class="wi-bolt" d="M25 31l-6 9h5l-3 7 9-11h-5l3-5z" fill="#f2bb5c"/>`;
  else if(s==='fog')b=cloud('#c9cfd8',0,-10)+[36,41,46].map((y,i)=>`<line x1="${8+i*3}" y1="${y}" x2="${40-i*2}" y2="${y}" stroke="#aab3c0" stroke-width="2.4" stroke-linecap="round"/>`).join('');
  else if(s==='snow')b=cloud('#d6dce5',0,-9)+[16,24,32].map((x,i)=>`<circle class="wi-drop" style="animation-delay:${i*.4}s" cx="${x}" cy="40" r="2" fill="#9fb6d4"/>`).join('');
  return`<svg class="wi ${cls}" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${b}</svg>`;
}

/* ----- tải dữ liệu (Open-Meteo, miễn phí, không cần khoá) ----- */
async function wxFetch(force){
  const loc=wxLoc()||WX_DEFAULT;
  try{const c=JSON.parse(localStorage.getItem(WXKEY));
    if(c&&c.lat===loc.lat&&c.lon===loc.lon){WXD.data=c.d;if(!force&&Date.now()-c.at<30*60e3)return}}catch(e){}
  WXD.loading=true;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4`;
    const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();if(!d.current)throw new Error('no data');
    WXD.data=d;WXD.err='';try{localStorage.setItem(WXKEY,JSON.stringify({at:Date.now(),lat:loc.lat,lon:loc.lon,d}))}catch(e){}
  }catch(e){WXD.err='Chưa tải được thời tiết — cần kết nối mạng.'}
  WXD.loading=false;
}
async function wxSearch(q){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=vi&format=json`);
  const d=await r.json();return(d.results||[]).map(x=>({name:x.name,sub:[x.admin1,x.country].filter(Boolean).join(', '),lat:+x.latitude.toFixed(2),lon:+x.longitude.toFixed(2)}));
}
function wxGeo(){
  return new Promise((res,rej)=>{if(!navigator.geolocation)return rej();
    navigator.geolocation.getCurrentPosition(async p=>{const lat=+p.coords.latitude.toFixed(2),lon=+p.coords.longitude.toFixed(2);let name='Vị trí của bạn';
      try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=vi`);const d=await r.json();name=d.city||d.locality||d.principalSubdivision||name}catch(e){}
      res({name,lat,lon})},rej,{timeout:10000,maximumAge:36e5})});
}
function wxCurrent(){
  if(WXD.preview){const day=!WXD.preview.endsWith('night');return{s:WXD.preview,k:WXD.preview==='rain'?.7:WXD.preview==='snow'?.8:1,day,wind:12}}
  if(WXD.data){const c=WXD.data.current;return{...sceneOf(c.weather_code,!!c.is_day),day:!!c.is_day,wind:c.wind_speed_10m||0}}
  const h=new Date().getHours(),day=h>=6&&h<18;return{s:day?'clear-day':'clear-night',k:0,day,wind:0};
}
function wxApply(){if(!wxEnabled()){sceneOff();return}sceneSet(wxCurrent())}

/* ----- động cơ vẽ hình nền ----- */
const SC={on:false,raf:0,lt:0,t:0,w:0,h:0,dpr:1,cfg:null,ctx:null,rain:[],snow:[],stars:[],motes:[],clouds:[],glass:[],fog:[],flash:0,bolt:null,nextBolt:0,flick:0,shoot:null,nextShoot:0,dark:false};
const rnd=(a,b)=>a+Math.random()*(b-a);
const isDarkNow=()=>getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#1b1a18';
function cloudSprite(scale,col){
  const W=Math.round(440*scale),H=Math.round(190*scale),cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const n=7+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){const f=i/(n-1),px=W*(.16+.68*f)+rnd(-18,18)*scale,py=H*.66-Math.sin(Math.PI*f)*H*rnd(.16,.3),r=rnd(46,82)*scale;
    const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col(1));g.addColorStop(.55,col(.7));g.addColorStop(1,col(0));x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
  return cv;
}
function newDrop(any){return{x:rnd(-150,SC.w+150),y:any?rnd(-SC.h,SC.h):rnd(-160,-20),l:rnd(14,26),v:rnd(13,20)}}
function scResize(){
  const c=$('#wxc');if(!c)return;SC.dpr=Math.min(devicePixelRatio||1,1.5);SC.w=innerWidth;SC.h=innerHeight;
  c.width=Math.round(SC.w*SC.dpr);c.height=Math.round(SC.h*SC.dpr);SC.ctx=c.getContext('2d');SC.ctx.setTransform(SC.dpr,0,0,SC.dpr,0,0);
}
function scBuild(){
  const{s,k,day,wind}=SC.cfg,W=SC.w,H=SC.h,area=Math.max(.45,W*H/(1280*800));SC.dark=isDarkNow();
  Object.assign(SC,{rain:[],snow:[],stars:[],motes:[],clouds:[],glass:[],fog:[],flash:0,bolt:null,nextBolt:SC.t+2500,shoot:null,nextShoot:SC.t+rnd(4000,9000)});
  SC.slant=Math.min(.4,(wind||0)/70)+.06;
  if(!day&&s!=='fog'){const n=Math.round((s==='cloudy-night'?40:s.startsWith('clear')?170:90)*area);
    for(let i=0;i<n;i++)SC.stars.push({x:rnd(0,W),y:Math.pow(Math.random(),1.4)*H*.7,r:rnd(.4,1.7),a:rnd(.35,1),sp:rnd(.0008,.003),ph:rnd(0,6.3)})}
  if(s==='clear-day'||s==='partly-day')for(let i=0;i<Math.round(46*area);i++)SC.motes.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,2.4),vy:rnd(-.22,-.06),vx:rnd(-.05,.12),ph:rnd(0,6.3)});
  let nc=0,col=null,dark=SC.dark;
  const C=(r,g,b,m=1)=>a=>`rgba(${r},${g},${b},${a*m})`;
  if(s==='partly-day'){nc=4;col=C(255,255,255,.95)}
  if(s==='cloudy-day'){nc=9;col=dark?C(120,128,140,.8):C(232,236,241)}
  if(s==='partly-night'){nc=3;col=C(85,95,120,.75)}
  if(s==='cloudy-night'){nc=8;col=C(70,80,100,.85)}
  if(s==='rain'){nc=7;col=day&&!dark?C(150,160,176,.85):C(58,66,84,.85)}
  if(s==='storm'){nc=9;col=day&&!dark?C(96,102,118,.9):C(42,47,62,.9)}
  if(s==='snow'){nc=5;col=C(236,240,246)}
  for(let i=0;i<nc;i++){const sc=rnd(.65,1.35)*Math.min(1.2,Math.max(.6,W/1100));SC.clouds.push({img:cloudSprite(sc,col),x:rnd(-300,W),y:rnd(-60,H*(s.startsWith('partly')?.32:.24)),v:rnd(.06,.2)*(s==='storm'?2.2:1),a:rnd(.55,.95)})}
  if(s==='rain'||s==='storm'){const n=Math.round((70+430*(s==='storm'?1:k))*Math.max(.5,W/1200));for(let i=0;i<n;i++)SC.rain.push(newDrop(true));
    if(k>=.4||s==='storm')for(let i=0;i<Math.round(14*area);i++)SC.glass.push({x:rnd(0,W),y:rnd(0,H),r:rnd(2,5.5),v:0})}
  if(s==='snow')for(let i=0;i<Math.round((60+140*k)*area);i++)SC.snow.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,3.6),vy:rnd(.35,1.1),ph:rnd(0,6.3),sw:rnd(.3,1)});
  if(s==='fog')for(let i=0;i<6;i++)SC.fog.push({y:rnd(H*.05,H*.95),x:rnd(-W,W*.3),v:rnd(.08,.25),w:rnd(W*.9,W*1.7),h:rnd(140,300),a:rnd(.22,.4)});
}
function sunPos(){return SC.w>=800?[SC.w*.86,SC.h*.08]:[SC.w*.66,30]}
function mkBolt(){const W=SC.w,H=SC.h;const path=[];let x=rnd(W*.15,W*.85),y=0;path.push([x,y]);const end=rnd(H*.35,H*.6);
  while(y<end){y+=rnd(18,40);x+=rnd(-28,28);path.push([x,y])}
  const br=[];const j=Math.floor(path.length*rnd(.3,.6));let[bx,by]=path[j];br.push([bx,by]);for(let i=0;i<5;i++){by+=rnd(15,30);bx+=rnd(5,30)*(Math.random()<.5?-1:1);br.push([bx,by])}
  return[path,br];
}
function scDraw(dt){
  const c=SC.ctx;if(!c||!SC.cfg)return;const W=SC.w,H=SC.h,{s,day}=SC.cfg;SC.t+=dt*16.67;const T=SC.t;
  c.clearRect(0,0,W,H);
  // mặt trời
  if(s==='clear-day'||s==='partly-day'){
    const[sx,sy]=sunPos(),R=Math.max(W,H)*.75,str=s==='clear-day'?1:.65;
    const g=c.createRadialGradient(sx,sy,0,sx,sy,R);g.addColorStop(0,`rgba(255,228,160,${.6*str})`);g.addColorStop(.18,`rgba(255,214,150,${.22*str})`);g.addColorStop(.55,`rgba(255,214,150,${.06*str})`);g.addColorStop(1,'rgba(255,214,150,0)');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.save();c.translate(sx,sy);c.rotate(T*.00003);c.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){c.rotate(Math.PI*2/14);const L=R*1.1,wd=L*(.035+.025*Math.sin(T*.0005+i*1.7));
      const gg=c.createLinearGradient(0,0,L,0);gg.addColorStop(0,`rgba(255,236,190,${.13*str})`);gg.addColorStop(1,'rgba(255,236,190,0)');
      c.fillStyle=gg;c.beginPath();c.moveTo(0,0);c.lineTo(L,-wd);c.lineTo(L,wd);c.closePath();c.fill()}
    c.restore();
    // lóa sáng
    c.save();c.globalCompositeOperation='lighter';[[.35,38,.05],[.55,18,.06],[.75,60,.03]].forEach(([f,r,a])=>{const fx=sx+(W*.3-sx)*f,fy=sy+(H*.7-sy)*f;const fg=c.createRadialGradient(fx,fy,0,fx,fy,r);fg.addColorStop(0,`rgba(255,240,200,${a*str})`);fg.addColorStop(1,'rgba(255,240,200,0)');c.fillStyle=fg;c.beginPath();c.arc(fx,fy,r,0,7);c.fill()});c.restore();
    c.save();c.shadowColor='rgba(255,200,110,.9)';c.shadowBlur=50;c.fillStyle=`rgba(255,243,210,${.95*str})`;c.beginPath();c.arc(sx,sy,W<800?22:30,0,7);c.fill();c.restore();
    c.fillStyle='rgba(255,230,170,1)';SC.motes.forEach(m=>{m.y+=m.vy*dt;m.x+=m.vx*dt+Math.sin(T*.001+m.ph)*.15*dt;if(m.y<-5){m.y=H+5;m.x=rnd(0,W)}
      c.globalAlpha=.25+.35*(.5+.5*Math.sin(T*.002+m.ph));c.beginPath();c.arc(m.x,m.y,m.r,0,7);c.fill()});c.globalAlpha=1;
  }
  // sao, trăng
  if(SC.stars.length){c.fillStyle='#fffbe8';SC.stars.forEach(st=>{c.globalAlpha=st.a*(.55+.45*Math.sin(T*st.sp+st.ph));c.beginPath();c.arc(st.x,st.y,st.r,0,7);c.fill()});c.globalAlpha=1;
    if(s==='clear-night'||s==='partly-night'){
      if(T>SC.nextShoot&&!SC.shoot){SC.shoot={x:rnd(W*.2,W*.9),y:rnd(0,H*.3),life:1}}
      if(SC.shoot){const sh=SC.shoot;sh.x-=7*dt;sh.y+=3*dt;sh.life-=.018*dt;const gr=c.createLinearGradient(sh.x,sh.y,sh.x+90,sh.y-38);gr.addColorStop(0,`rgba(255,255,240,${Math.max(0,sh.life)})`);gr.addColorStop(1,'rgba(255,255,240,0)');
        c.strokeStyle=gr;c.lineWidth=1.6;c.beginPath();c.moveTo(sh.x,sh.y);c.lineTo(sh.x+90,sh.y-38);c.stroke();if(sh.life<=0){SC.shoot=null;SC.nextShoot=T+rnd(6000,16000)}}}
  }
  if(!day&&(s==='clear-night'||s==='partly-night'||s==='cloudy-night')){const[mx,my]=sunPos();
    const g=c.createRadialGradient(mx,my,0,mx,my,220);g.addColorStop(0,'rgba(240,232,200,.35)');g.addColorStop(1,'rgba(240,232,200,0)');c.fillStyle=g;c.beginPath();c.arc(mx,my,220,0,7);c.fill();
    c.save();c.shadowColor='rgba(240,232,200,.8)';c.shadowBlur=30;c.fillStyle='#f3ebcf';c.beginPath();c.arc(mx,my,24,0,7);c.fill();c.restore();
    c.fillStyle='rgba(200,190,160,.35)';[[-7,-5,5],[6,4,4],[-2,9,3]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(mx+dx,my+dy,r,0,7);c.fill()})}
  // mây
  SC.clouds.forEach(cl=>{cl.x+=cl.v*dt;if(cl.x>W+20){cl.x=-cl.img.width-rnd(0,250);cl.y=rnd(-60,H*.25)}c.globalAlpha=cl.a;c.drawImage(cl.img,cl.x,cl.y)});c.globalAlpha=1;
  // sương mù
  SC.fog.forEach(f=>{f.x+=f.v*dt;if(f.x>W)f.x=-f.w;const g=c.createRadialGradient(f.x+f.w/2,f.y,0,f.x+f.w/2,f.y,f.w/2);const col=SC.dark?'150,155,160':'245,245,240';
    g.addColorStop(0,`rgba(${col},${f.a})`);g.addColorStop(1,`rgba(${col},0)`);c.save();c.translate(f.x+f.w/2,f.y);c.scale(1,f.h/f.w);c.translate(-(f.x+f.w/2),-f.y);c.fillStyle=g;c.beginPath();c.arc(f.x+f.w/2,f.y,f.w/2,0,7);c.fill();c.restore()});
  // mưa
  if(SC.rain.length){const sl=SC.slant;c.strokeStyle=SC.dark||!day?'rgba(205,218,235,.38)':'rgba(70,92,120,.33)';c.lineWidth=1.1;c.beginPath();
    SC.rain.forEach(d=>{d.y+=d.v*dt;d.x+=d.v*sl*dt;if(d.y>H+30)Object.assign(d,newDrop(false));c.moveTo(d.x,d.y);c.lineTo(d.x-d.l*sl,d.y-d.l)});c.stroke();
    SC.glass.forEach(g=>{if(Math.random()<.004*dt)g.v=rnd(.6,2.4);g.y+=g.v*dt;g.v*=Math.pow(.97,dt);if(g.y>H+10){g.y=-10;g.x=rnd(0,W)}
      const gr=c.createRadialGradient(g.x-g.r*.3,g.y-g.r*.3,0,g.x,g.y,g.r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.6,'rgba(200,215,230,.18)');gr.addColorStop(1,'rgba(120,140,160,.25)');
      c.fillStyle=gr;c.beginPath();c.ellipse(g.x,g.y,g.r,g.r*1.15,0,0,7);c.fill()})}
  // tuyết
  if(SC.snow.length){c.fillStyle=SC.dark?'rgba(240,244,250,.85)':'rgba(255,255,255,.95)';SC.snow.forEach(f=>{f.y+=f.vy*dt;f.x+=Math.sin(T*.001*f.sw+f.ph)*.5*dt;if(f.y>H+5){f.y=-5;f.x=rnd(0,W)}c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.fill()})}
  // sấm chớp
  if(s==='storm'){
    if(T>SC.nextBolt){SC.flash=1;SC.bolt=mkBolt();SC.nextBolt=T+rnd(5000,13000);SC.flick=T+140}
    if(SC.flick&&T>SC.flick){SC.flash=.85;SC.flick=0}
    if(SC.flash>.02){c.fillStyle=`rgba(235,240,255,${SC.flash*.32})`;c.fillRect(0,0,W,H);
      if(SC.bolt&&SC.flash>.25){c.save();c.strokeStyle=`rgba(255,255,240,${SC.flash})`;c.lineWidth=2.4;c.shadowColor='rgba(210,225,255,1)';c.shadowBlur=22;c.lineJoin='round';
        SC.bolt.forEach((p,bi)=>{c.lineWidth=bi?1.3:2.4;c.beginPath();c.moveTo(p[0][0],p[0][1]);p.forEach(q=>c.lineTo(q[0],q[1]));c.stroke()});c.restore()}
      SC.flash*=Math.pow(.86,dt)}
  }
}
function scLoop(ts){if(!SC.on)return;SC.raf=requestAnimationFrame(scLoop);const dt=SC.lt?Math.min(3,(ts-SC.lt)/16.67):1;SC.lt=ts;scDraw(dt)}
const TINTS={
  'clear-day':'linear-gradient(180deg,rgba(255,206,130,.42),rgba(255,226,180,.16) 38%,rgba(255,226,180,0) 70%)',
  'partly-day':'linear-gradient(180deg,rgba(140,185,230,.42),rgba(190,215,240,.16) 40%,rgba(190,215,240,0) 72%)',
  'cloudy-day':'linear-gradient(180deg,rgba(140,155,175,.45),rgba(170,180,195,.18) 45%,rgba(170,180,195,0) 80%)',
  'rain':'linear-gradient(180deg,rgba(95,112,135,.55),rgba(120,135,155,.25) 50%,rgba(120,135,155,.08))',
  'storm':'linear-gradient(180deg,rgba(45,52,70,.7),rgba(70,78,98,.35) 55%,rgba(70,78,98,.12))',
  'fog':'linear-gradient(180deg,rgba(215,215,210,.55),rgba(215,215,210,.3) 60%,rgba(215,215,210,.15))',
  'snow':'linear-gradient(180deg,rgba(190,205,225,.5),rgba(220,230,240,.2) 50%,rgba(220,230,240,0) 85%)',
  'night':'linear-gradient(180deg,rgba(14,22,48,.85),rgba(28,38,72,.45) 45%,rgba(28,38,72,0) 85%)',
  'rain-night':'linear-gradient(180deg,rgba(18,24,38,.8),rgba(30,38,55,.4) 50%,rgba(30,38,55,.12))'
};
let tintFlip=false;
function skyTint(cfg){
  const key=!cfg?null:(!cfg.day&&(cfg.s==='rain'||cfg.s==='storm'))?'rain-night':(!cfg.day&&cfg.s.includes('night'))?'night':(!cfg.day&&cfg.s==='snow')?'night':cfg.s;
  const a=$('#skyA'),b=$('#skyB');if(!a)return;const[on,off]=tintFlip?[a,b]:[b,a];tintFlip=!tintFlip;
  if(key){on.style.background=TINTS[key];on.style.opacity=1}else on.style.opacity=0;off.style.opacity=0;
}
function sceneSet(cfg){
  const same=SC.cfg&&SC.cfg.s===cfg.s&&SC.cfg.k===cfg.k&&SC.cfg.day===cfg.day;
  SC.cfg=cfg;document.documentElement.classList.add('wx-on');
  document.documentElement.classList.toggle('wx-dim',!cfg.day||cfg.s==='storm');if(!same)skyTint(cfg);
  if(!SC.ctx)scResize();if(!same)scBuild();
  cancelAnimationFrame(SC.raf);SC.lt=0;
  if(RM){SC.on=false;scDraw(0)}else{SC.on=true;SC.raf=requestAnimationFrame(scLoop)}
}
function sceneOff(){SC.on=false;cancelAnimationFrame(SC.raf);if(SC.ctx)SC.ctx.clearRect(0,0,SC.w,SC.h);SC.cfg=null;skyTint(null);document.documentElement.classList.remove('wx-on','wx-dim')}
let scRT;addEventListener('resize',()=>{clearTimeout(scRT);scRT=setTimeout(()=>{scResize();if(SC.cfg){scBuild();if(RM)scDraw(0)}},200)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){SC.on=false;cancelAnimationFrame(SC.raf)}else if(SC.cfg&&!RM&&!SC.on){SC.on=true;SC.lt=0;SC.raf=requestAnimationFrame(scLoop)}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(SC.cfg)scBuild()});

/* ----- cài đặt thời tiết ----- */
function wxSettingsHTML(){
  const loc=wxLoc()||WX_DEFAULT,on=wxEnabled();
  return`<div class="seg" style="margin-bottom:14px"><button class="chip ${on?'on':''}" data-wxon="1">Bật</button><button class="chip ${on?'':'on'}" data-wxon="0">Tắt</button></div>
    <label class="f" style="margin-top:0">Vị trí <span class="hint">— hiện tại: <b>${esc(loc.name)}</b>${wxLoc()?'':' (mặc định)'}</span></label>
    <div class="row" style="flex-wrap:nowrap"><input type="search" id="wxQ" placeholder="Tìm thành phố, VD: Đà Lạt"><button class="btn" id="wxFind" style="flex:none">Tìm</button></div>
    <div id="wxRes" style="margin-top:8px"></div>
    <button class="btn ghost" id="wxGeo" style="padding-left:0;color:var(--accent)">⌖ Dùng vị trí hiện tại của máy</button>
    <label class="f">Xem thử hiệu ứng</label>
    <div class="seg">${PREVIEWS.map(([k,n])=>`<button class="chip ${(WXD.preview||'')===k?'on':''}" data-pv="${k}">${n}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="wxNow">Cập nhật thời tiết</button>
      <span class="muted" style="font-size:13px">${WXD.data?'Cập nhật lúc '+fmtTime(JSON.parse(localStorage.getItem(WXKEY)||'{}').at||Date.now()):WXD.err||''}</span></div>
    <p class="muted" style="font-size:13px;margin-bottom:0">Dữ liệu từ Open-Meteo (miễn phí). App chỉ gửi toạ độ thành phố để lấy dự báo — nhật ký của bạn không rời khỏi máy.</p>`;
}
function bindWxSettings(box,rerender){
  box.querySelectorAll('[data-wxon]').forEach(b=>b.onclick=()=>{wxSetEnabled(b.dataset.wxon==='1');if(wxEnabled())wxRefresh(false);else sceneOff();rerender()});
  box.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{WXD.preview=b.dataset.pv||null;if(!wxEnabled())wxSetEnabled(true);wxApply();rerender()});
  const pick=async l=>{wxSetLoc(l);WXD.data=null;toast(`Đã chọn ${l.name}`);rerender();await wxRefresh(true);rerender()};
  const find=async()=>{const q=$('#wxQ').value.trim();if(!q)return;const R=$('#wxRes');R.innerHTML='<span class="muted">Đang tìm…</span>';
    try{const rs=await wxSearch(q);R.innerHTML=rs.length?rs.map((r,i)=>`<button class="memory" data-i="${i}"><small>${esc(r.sub)}</small><span>${esc(r.name)}</span></button>`).join(''):'<span class="muted">Không tìm thấy địa điểm này.</span>';
      R.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(rs[+b.dataset.i]))}catch(e){R.innerHTML='<span class="muted">Không tìm được — kiểm tra kết nối mạng.</span>'}};
  $('#wxFind').onclick=find;$('#wxQ').onkeydown=e=>{if(e.key==='Enter')find()};
  $('#wxGeo').onclick=async()=>{toast('Đang lấy vị trí…');try{pick(await wxGeo())}catch(e){toast('Không lấy được vị trí — hãy tìm theo tên thành phố')}};
  $('#wxNow').onclick=async()=>{await wxRefresh(true);rerender();toast(WXD.err||'Đã cập nhật thời tiết')};
}

/* ---------- Giao diện sáng/tối ---------- */
function getTheme(){try{return localStorage.getItem(THEME)}catch(e){return null}}
function setTheme(t){try{t==='auto'?localStorage.removeItem(THEME):localStorage.setItem(THEME,t)}catch(e){}applyTheme();if(SC.cfg){scBuild();if(RM)scDraw(0)}}
function applyTheme(){const t=getTheme();t&&t!=='auto'?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme')}
$('#themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#1b1a18';setTheme(dark?'light':'dark')};
applyTheme();updateLockBtn();
$('#lockBtn').onclick=lockNow;
if(getPin())lockNow();
render();
wxApply();if(wxEnabled())wxRefresh(false);
abInit().then(()=>{if(AB.status!=='off'&&(view==='home'||view==='settings'))render()});
</script>
